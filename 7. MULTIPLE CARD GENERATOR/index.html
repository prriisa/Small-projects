<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple Card Generator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <section class="main">
        <h3>ADD CARD</h3>
        <form>
            <input required type="url" placeholder="Profile picture URL">
            <input required type="text" placeholder="Full Name">
            <input required type="email" placeholder="Email Address">
            <input required type="text" placeholder="Your specifications">
            <input class="submit" type="submit" value="Generate Card">
        </form>
    </section>
    <section class="cards w-[70vw]">

    </section>

    <script src="script.js"></script>
</body>

</html>
